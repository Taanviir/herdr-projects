id = "taanviir.projects"
name = "Projects"
version = "0.1.1"
min_herdr_version = "0.9.0"
description = "Your projects and their past Claude or Codex sessions, with any dev server running in them"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open"
title = "Projects"
contexts = ["workspace"]
command = ["node", "bin/open.js"]

[[actions]]
id = "ci"
title = "Watch CI for this commit"
contexts = ["workspace"]
command = ["node", "bin/ci.js"]

[[actions]]
id = "setup"
title = "Set up the Projects key"
contexts = ["workspace"]
command = ["node", "bin/setup.js"]

[[panes]]
id = "picker"
title = "Projects"
placement = "popup"
width = 92
height = 23
command = ["node", "bin/picker.js"]
